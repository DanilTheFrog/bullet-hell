[package]
name = "bullet_hell"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d", "ui"
] }
bevy_ecs_tilemap = "0.20.0"
serde = { version = "1", features = ["derive"] }
ron = "0.12.3"
rand = "0.10.3"
bevy_kira_audio = "0.27.1"
thiserror = { version = "2.0" }
tiled = { version = "0.14.0", default-features = false }

[features]
dev = [
    "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
    "bevy/debug",
    "bevy/file_watcher",
]
profiling = ["bevy/trace_tracy"]
android = ["bevy/android-game-activity"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true